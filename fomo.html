@font-face{font-family:"DungGeunMo";src:local("DungGeunMo"),local("둥근모꼴"),local("DungGeunMo Regular")}
:root{--px:"FOMO Pixel","DungGeunMo","Nanum Gothic Coding","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",monospace;--f0:16px;--f1:32px;--f2:48px;--bg:#c9d4a2;--l1:#a7b682;--mid:#7b8a57;--dark:#3d4a2b;--line:#141a0e;--fog:#1f2716;--s:4px;--cue:#c9d4a2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fog);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--px);font-weight:400;-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-smooth:never;text-rendering:optimizeSpeed;user-select:none;-webkit-user-select:none;color:var(--line)}
#stage{position:relative;transform-origin:50% 50%;box-shadow:0 0 0 calc(var(--s)*2) var(--fog),0 0 0 calc(var(--s)*3) var(--dark)}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.hidden{display:none!important}
/* gauge */
#gauge{position:absolute;left:calc(var(--s)*4);top:calc(var(--s)*4);display:flex;align-items:center;gap:calc(var(--s)*2);pointer-events:none}
#gauge .lbl{font-size:var(--f0);line-height:1;color:var(--line);background:var(--bg);padding:calc(var(--s)*1) calc(var(--s)*1.5);box-shadow:0 0 0 var(--s) var(--line)}
#gauge .bar{position:relative;width:calc(var(--s)*44);height:calc(var(--s)*6);background:var(--bg);box-shadow:0 0 0 var(--s) var(--line)}
#gauge .ghost,#gauge .fill{position:absolute;left:var(--s);top:var(--s);bottom:var(--s);width:0}
#gauge .ghost{background:var(--mid)}
#gauge .fill{background:repeating-linear-gradient(90deg,var(--line) 0 calc(var(--s)*3),transparent calc(var(--s)*3) calc(var(--s)*4))}
#gauge.flash .bar{background:var(--l1)}
#gauge.bump{animation:bump .28s steps(4)}
#gauge.high .lbl{animation:tremble .18s steps(2) infinite}
@keyframes bump{0%{transform:translate(0,0)}25%{transform:translate(calc(var(--s)*1),calc(var(--s)*-1))}50%{transform:translate(calc(var(--s)*-1),0)}75%{transform:translate(0,calc(var(--s)*1))}100%{transform:translate(0,0)}}
@keyframes tremble{0%{transform:translateX(0)}100%{transform:translateX(var(--s))}}
/* buttons */
#btns{position:absolute;right:calc(var(--s)*4);top:calc(var(--s)*4);display:flex;gap:calc(var(--s)*3)}
.pbtn{width:calc(var(--s)*9);height:calc(var(--s)*9);min-width:28px;min-height:28px;padding:0;border:0;background:var(--bg);box-shadow:0 0 0 var(--s) var(--line);cursor:pointer;display:grid;place-items:center}
.pbtn svg{width:70%;height:70%;shape-rendering:crispEdges}
.pbtn svg rect{fill:var(--line)}
.pbtn:hover,.pbtn:focus-visible{background:var(--l1);outline:none}
/* text box */
#box{position:absolute;left:calc(var(--s)*6);right:calc(var(--s)*6);bottom:calc(var(--s)*5);min-height:calc(var(--s)*20);background:var(--bg);box-shadow:0 0 0 var(--s) var(--line),0 0 0 calc(var(--s)*2) var(--bg),0 0 0 calc(var(--s)*3) var(--line);padding:calc(var(--s)*4) calc(var(--s)*5);font-size:var(--f1);line-height:1.25;color:var(--line)}
#box .name{position:absolute;top:calc(var(--s)*-7);left:calc(var(--s)*3);background:var(--line);color:var(--bg);font-size:var(--f0);line-height:1;padding:calc(var(--s)*1) calc(var(--s)*2.5)}
#box .caret{display:inline-block;width:calc(var(--s)*2);height:calc(var(--s)*2);background:var(--line);margin-left:calc(var(--s)*1.5);vertical-align:middle;animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* hints */
.hint{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:var(--f0);line-height:1;background:var(--line);color:var(--bg);padding:calc(var(--s)*1.2) calc(var(--s)*3);pointer-events:none}
#soundHint{top:calc(var(--s)*16);animation:blink 1.2s steps(1) infinite}
#ctrlHint{bottom:calc(var(--s)*5)}
#skipHint{bottom:calc(var(--s)*1.2);right:calc(var(--s)*3);left:auto;transform:none;background:none;color:var(--l1);font-size:var(--f0);padding:0}
/* laugh captions */
.kk{position:absolute;transform:translate(-50%,-50%);color:var(--cue);font-size:var(--f1);line-height:1;pointer-events:none;animation:kk 1.4s steps(7) forwards;white-space:nowrap}
.kk.big{font-size:var(--f2)}
@keyframes kk{0%{opacity:0;margin-top:0}15%{opacity:1}80%{opacity:1}100%{opacity:0;margin-top:calc(var(--s)*-8)}}
/* overlays */
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,14,.55)}
.card{background:var(--bg);box-shadow:0 0 0 var(--s) var(--line),0 0 0 calc(var(--s)*2) var(--bg),0 0 0 calc(var(--s)*3) var(--line);padding:calc(var(--s)*7) calc(var(--s)*10);text-align:center;color:var(--line);min-width:calc(var(--s)*90)}
.card h2{margin:0 0 calc(var(--s)*5);font-weight:400;font-size:var(--f2);line-height:1}
.card p{margin:calc(var(--s)*3) 0 0;font-size:var(--f1);line-height:1.2}
.card .row{display:flex;flex-direction:column;gap:calc(var(--s)*3);margin-top:calc(var(--s)*6);align-items:center}
.tbtn{font:inherit;font-family:var(--px);font-size:var(--f1);line-height:1.2;min-height:44px;padding:calc(var(--s)*1.5) calc(var(--s)*6);border:0;background:var(--bg);color:var(--line);box-shadow:0 0 0 var(--s) var(--line);cursor:pointer;min-width:calc(var(--s)*50)}
.tbtn:hover,.tbtn:focus-visible{background:var(--line);color:var(--bg);outline:none}
.endbar{position:relative;width:calc(var(--s)*70);height:calc(var(--s)*8);margin:0 auto;background:var(--bg);box-shadow:0 0 0 var(--s) var(--line)}
.endbar i{position:absolute;left:var(--s);top:var(--s);bottom:var(--s);width:0;background:repeating-linear-gradient(90deg,var(--line) 0 calc(var(--s)*3),transparent calc(var(--s)*3) calc(var(--s)*4))}
.endnum{font-size:calc(var(--f1)*2);line-height:1;margin-top:calc(var(--s)*4)}
.endnum small{font-size:.45em}
.quiet{opacity:.75}
/* floating chatter text */
.fl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;line-height:1;font-family:var(--px)}
.fl.n{background:var(--bg);color:var(--line);padding:calc(var(--s)*.75) calc(var(--s)*1.5);box-shadow:0 0 0 var(--s) var(--line)}
.fl.n::after{content:"";position:absolute;left:calc(var(--s)*3);bottom:calc(var(--s)*-2);width:var(--s);height:var(--s);background:var(--line)}
.fl.h{color:#f0f0ea;text-shadow:var(--s) 0 #000,calc(var(--s)*-1) 0 #000,0 var(--s) #000,0 calc(var(--s)*-1) #000}
.fl.r{color:#ff0000}
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <div id="gauge" class="hidden" aria-label="FOMO 게이지"><span class="lbl">FOMO</span><div class="bar"><div class="ghost"></div><div class="fill"></div></div></div>
  <div id="btns">
    <button class="pbtn" id="bPause" aria-label="일시정지" title="일시정지 (P / Esc)"><svg viewBox="0 0 7 7"><rect x="1" y="1" width="2" height="5"/><rect x="4" y="1" width="2" height="5"/></svg></button>
    <button class="pbtn" id="bRestart" aria-label="다시하기" title="다시하기"><svg viewBox="0 0 7 7"><rect x="2" y="1" width="3" height="1"/><rect x="1" y="2" width="1" height="3"/><rect x="2" y="5" width="3" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="4" y="0" width="1" height="3"/><rect x="5" y="1" width="1" height="1"/></svg></button>
  </div>
  <div id="box" class="hidden"><span class="name hidden"></span><span class="txt"></span><span class="caret hidden"></span></div>
  <div id="soundHint" class="hint">클릭하거나 아무 키나 누르면 소리가 켜져요 · 이어폰 권장</div>
  <div id="ctrlHint" class="hint hidden">방향키 / WASD 이동 · 친구들의 목소리를 따라가세요</div>
  <div id="skipHint" class="hint hidden">Enter 건너뛰기</div>
  <div id="pauseOv" class="ov hidden"><div class="card"><h2>PAUSE</h2><p class="quiet">일시정지</p><div class="row">
    <button class="tbtn" id="pResume">계속하기</button>
    <button class="tbtn" id="pMute">소리 끄기</button>
    <button class="tbtn" id="pRestart">다시하기</button></div></div></div>
  <div id="endOv" class="ov hidden"><div class="card"><h2>FOMO</h2>
    <div class="endbar"><i id="endFill"></i></div>
    <div class="endnum" id="endNum">0<small>/100</small></div>
    <p class="quiet">…별일 없었다.</p>
    <div class="row"><button class="tbtn" id="eRestart">다시하기</button></div></div></div>
</div>
<script>
{
'use strict';
// ================== constants ==================
const W=192,H=160,T=16;
const BG=0,L1=1,MID=2,DK=3,LN=4,FOG=5;
const PN=[[201,212,162],[167,182,130],[123,138,87],[61,74,43],[20,26,14],[31,39,22]];
const PH=[[0,0,0],[14,14,14],[32,32,32],[64,64,64],[240,240,234],[0,0,0]];
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const by=(x,y)=>BAYER[(y&3)*4+(x&3)]/16;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const $=id=>document.getElementById(id);

// ================== canvas ==================
const stage=$('stage'),cv=$('screen'),sx=cv.getContext('2d');
const lo=document.createElement('canvas');lo.width=W;lo.height=H;const X=lo.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const TX=tmp.getContext('2d');
let S=4,FS=[16,32,48];
function resize(){
  const f=Math.min(innerWidth/(W+8),innerHeight/(H+8));
  S=Math.max(1,Math.floor(f));
  cv.width=W*S;cv.height=H*S;
  stage.style.width=W*S+'px';stage.style.height=H*S+'px';
  const rs=document.documentElement.style;rs.setProperty('--s',S+'px');
  const u=Math.max(1,Math.floor(S/2));rs.setProperty('--f0',16*Math.max(1,Math.floor(S/4))+'px');
  rs.setProperty('--f1',16*u+'px');rs.setProperty('--f2',16*(u+1)+'px');FS=[16*Math.max(1,Math.floor(S/4)),16*u,16*(u+1)];
}
addEventListener('resize',resize);resize();

// ================== palette ==================
let P=[],palT=-1;const patCache=new Map();
function setPalette(t){
  t=clamp(t,0,1);
  if(palT>=0&&Math.abs(t-palT)<0.002)return;
  palT=t;patCache.clear();
  P=PN.map((c,i)=>{const h=PH[i];return `rgb(${Math.round(c[0]+(h[0]-c[0])*t)},${Math.round(c[1]+(h[1]-c[1])*t)},${Math.round(c[2]+(h[2]-c[2])*t)})`;});
  const r=document.documentElement.style;
  r.setProperty('--bg',P[BG]);r.setProperty('--l1',P[L1]);r.setProperty('--mid',P[MID]);
  r.setProperty('--dark',P[DK]);r.setProperty('--line',P[LN]);r.setProperty('--fog',P[FOG]);
  r.setProperty('--cue',t>0.5?P[LN]:P[BG]);
}
setPalette(0);
function R(x,y,w,h,c){X.fillStyle=P[c];X.fillRect(x,y,w,h);}
function pat(level,c){
  level=clamp(Math.round(level),0,16);
  const k=level+'|'+c;let p=patCache.get(k);
  if(!p){const pc=document.createElement('canvas');pc.width=pc.height=4;const q=pc.getContext('2d');q.fillStyle=P[c];
    for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(by(x,y)<level/16)q.fillRect(x,y,1,1);
    p=X.createPattern(pc,'repeat');patCache.set(k,p);}
  return p;
}
function ditherRect(x,y,w,h,level,c){if(level<=0)return;X.fillStyle=pat(level,c);X.fillRect(x,y,w,h);}
function makeMask(r0,r1,cy){
  const c=document.createElement('canvas');c.width=W;c.height=H;const m=c.getContext('2d');
  const id=m.createImageData(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=Math.hypot(x+.5-W/2,y+.5-cy);const a=(d-r0)/(r1-r0);
    if(a>by(x,y))id.data[(y*W+x)*4+3]=255;}
  m.putImageData(id,0,0);return c;
}
const MASKS=[makeMask(54,86,H/2),makeMask(49,80,H/2),makeMask(43,73,H/2)];
const SOFT=makeMask(82,150,H/2);
function drawMask(m){
  TX.globalCompositeOperation='source-over';TX.clearRect(0,0,W,H);TX.drawImage(m,0,0);
  TX.globalCompositeOperation='source-in';TX.fillStyle=P[FOG];TX.fillRect(0,0,W,H);
  TX.globalCompositeOperation='source-over';X.drawImage(tmp,0,0);
}

// ================== sprites ==================
const HEAD=["...oooooo...","..offffffo..",".offffffffo.","offffffffffo","offffffffffo","offffffffffo","offffffffffo","offffffffffo",".offffffffo.","..oooooooo.."];
const BODY={
  front:[["...offffo...","..offffffo..",".ofoffffofo.",".oooffffooo.","..offooffo..","..ooo..ooo.."],
         ["...offffo...","..offffffo..",".ofoffffofo.",".oooffffooo.","..oooooffo..",".......ooo.."],
         ["...offffo...","..offffffo..",".ofoffffofo.",".oooffffooo.","..offooooo..","..ooo......."]],
  side:[["....offfo...","...offffo...","...ofoffo...","...oooffo...","....offo....","....oooo...."],
        ["....offfo...","...offffo...","...ofoffo...","...oooffo...","...ofooofo..","...oo...oo.."],
        ["....offfo...","...offffo...","...ofoffo...","...oooffo...","....offo....","....oooo...."]]
};
function blit(rows,x,y,map,flip,maxRow){
  const w=rows[0].length;const n=maxRow===undefined?rows.length:Math.min(rows.length,maxRow);
  for(let r=0;r<n;r++){const row=rows[r];let c=0;
    while(c<w){const ch=row[c];if(ch==='.'){c++;continue;}let e=c+1;while(e<w&&row[e]===ch)e++;
      const col=map[ch];if(col!==undefined){const px=flip?x+(w-e):x+c;R(px,y+r,e-c,1,col);}c=e;}}
}
// char: {x,y (top-left), face, frame, kind:'me'|'friend', eyes:'dot'|'laugh', seated}
function drawChar(o){
  const me=o.kind!=='friend';
  const map=me?{o:LN,f:BG}:{o:LN,f:LN};const eyeC=me?LN:BG;
  const x=Math.round(o.x),y=Math.round(o.y)+(o.bob||0);
  const side=o.face==='left'||o.face==='right';const flip=o.face==='left';
  const body=(side?BODY.side:BODY.front)[o.frame||0];
  blit(HEAD,x,y,map,flip);
  blit(body,x,y+10,map,flip,o.seated?4:undefined);
  if(o.face==='up')return;
  const ex=side?[flip?2:9]:[3,8];
  for(const c of ex){
    if(o.eyes==='laugh'){R(x+c-1,y+6,1,1,eyeC);R(x+c,y+5,1,1,eyeC);R(x+c+1,y+6,1,1,eyeC);}
    else R(x+c,y+5,1,2,eyeC);
  }
}
const PROPS=[
 {m:{o:LN,l:L1,m:MID},r:["....oooo....","..oollllo...",".olllloolo..",".ollolllllo.","olllllollllo",".ollllllllo.","..oolllloo..","....oooo....","...ommmmo...","..ommmmmmo..","..ommmmmmo..","..ommmmmmo..","...oooooo..."]},
 {m:{o:LN,f:BG,m:MID,d:DK},r:["..oooooooo..","..ommmmmmo..","..ommmmmmo..","..ommmmmmo..","..oooooooo..",".offffffffo.",".oooooooooo.",".odo....odo.",".odo....odo.",".odo....odo.",".ooo....ooo."]},
 {m:{o:LN,f:BG,d:DK,m:MID},r:[".....oo.....","....offo....","....offo....",".oooooooooo.","offfffffffffo".slice(0,12),".oooooooooo.","....oddo....","....oddo....","....oddo....","...oooooo..."]},
 {m:{o:LN,m:MID,l:L1},r:["oooooooo....","ommmmmmo....","omoooomo....","ommmmmmo....","oooooooooooo","olllllloollo","ollllllollo.".padEnd(12,'.'),"oooooooooooo"]}
];
const FONT={W:["o...o","o...o","o.o.o","o.o.o",".o.o."],C:["ooo","o..","o..","o..","ooo"],A:[".o.","o.o","ooo","o.o","o.o"],F:["ooo","o..","oo.","o..","o.."],E:["ooo","o..","oo.","o..","ooo"],'>':["o..",".o.","..o",".o.","o.."]};
function text(s,x,y,c){for(const ch of s){const gl=FONT[ch];if(gl){blit(gl,x,y,{o:c});x+=gl[0].length+1;}else x+=4;}}
// smiling eye pairs (pure red). frames: 0 rest, 1 tails lift (squint), 2 bob down 1px  → "키득키득"
const EYE_RED='#ff0000';
const EYES={
 s:{w:7,h:4,gap:5,f:[["..xxx..",".xxxxx.","xx...xx","x.....x"],["..xxx..",".xxxxx.","xx...xx","......."],[".......","..xxx..",".xxxxx.","xx...xx"]]},
 b:{w:9,h:5,gap:6,f:[["...xxx...",".xxxxxxx.","xxx...xxx","xx.....xx","x.......x"],["...xxx...",".xxxxxxx.","xxx...xxx","xx.....xx","........."],[".........","...xxx...",".xxxxxxx.","xxx...xxx","xx.....xx"]]}
};
const pairW=sh=>sh.w*2+sh.gap;

// ================== audio ==================
const VOW=[[800,1200],[500,1800],[320,2300],[520,900],[360,800],[650,1700]];
// Each friend: base f0, helium pitch multiplier (f0) and gain — pitch and volume are independent.
// "Helium" = higher pitch AND formants shifted up (vocal tract resonances rise), not faster playback.
const VOICES=[{f0:205,pitch:1.38,gain:1.0},{f0:150,pitch:1.45,gain:1.1},{f0:250,pitch:1.33,gain:.95}];
const A={ctx:null,on:false,muted:false,bus:null,formant:1.22,voiceGain:2.6,masterVol:1};
A.init=function(){
  if(A.ctx){if(A.ctx.state==='suspended'&&!paused)A.ctx.resume().catch(()=>{});return;}
  try{
    const C=new (window.AudioContext||window.webkitAudioContext)();A.ctx=C;A.build();
    if(C.state==='suspended')C.resume().catch(()=>{});
  }catch(e){A.on=false;}
};
A.build=function(){
  const C=A.ctx;
  // master → glue compressor → brick-wall style limiter → output (peak-limited)
  A.master=C.createGain();A.master.gain.value=A.muted?0:A.masterVol;
  const comp=C.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=8;comp.ratio.value=3.5;comp.attack.value=.008;comp.release.value=.2;
  const lim=C.createDynamicsCompressor();lim.threshold.value=-6;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.12;
  const out=C.createGain();out.gain.value=.9;
  A.master.connect(comp);comp.connect(lim);lim.connect(out);out.connect(C.destination);
  const len=C.sampleRate*2,buf=C.createBuffer(1,len,C.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.noise=buf;
  // drone for horror
  A.droneG=C.createGain();A.droneG.gain.value=0;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;
  for(const f of[55,55.8,82.4]){const o=C.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();}
  lp.connect(A.droneG);A.droneG.connect(A.master);
  // horror bus: many panned laugh layers → dry + short echo + reverb
  const h={};h.in=C.createGain();h.out=C.createGain();h.out.gain.value=0;
  const dry=C.createGain();dry.gain.value=.75;h.in.connect(dry);dry.connect(h.out);
  h.rev=C.createConvolver();h.rev.buffer=A.impulse(1.6,2.6);const rw=C.createGain();rw.gain.value=.6;h.in.connect(h.rev);h.rev.connect(rw);rw.connect(h.out);
  const dl=C.createDelay(1);dl.delayTime.value=.11;const fb=C.createGain();fb.gain.value=.38;const ew=C.createGain();ew.gain.value=.45;
  const dhp=C.createBiquadFilter();dhp.type='highpass';dhp.frequency.value=300;
  h.in.connect(dl);dl.connect(dhp);dhp.connect(fb);fb.connect(dl);dl.connect(ew);ew.connect(h.out);
  h.out.connect(A.master);A.hbus=h;
  A.makeBus();A.on=true;
};
// stereo reverb impulse: decaying noise, slightly different per channel
A.impulse=function(sec,decay){const C=A.ctx,n=Math.floor(C.sampleRate*sec),b=C.createBuffer(2,n,C.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;};
A.makeBus=function(){
  const C=A.ctx;if(!C)return;
  if(A.bus){const old=A.bus;old.in.gain.setTargetAtTime(0,C.currentTime,.02);old.out.gain.setTargetAtTime(0,C.currentTime,.02);
    setTimeout(()=>{try{old.in.disconnect();old.out.disconnect();}catch(e){}},500);}
  const b={};b.in=C.createGain();b.lp=C.createBiquadFilter();b.lp.type='lowpass';b.lp.frequency.value=8000;b.lp.Q.value=.5;
  b.vol=C.createGain();b.vol.gain.value=.8;
  b.pan=C.createStereoPanner?C.createStereoPanner():null;
  b.out=C.createGain();
  b.in.connect(b.lp);b.lp.connect(b.vol);
  if(b.pan){b.vol.connect(b.pan);b.pan.connect(b.out);}else b.vol.connect(b.out);
  b.out.connect(A.master);
  b.dl=C.createDelay(1);b.dl.delayTime.value=.23;b.fb=C.createGain();b.fb.gain.value=.4;b.wet=C.createGain();b.wet.gain.value=0;
  b.in.connect(b.dl);b.dl.connect(b.fb);b.fb.connect(b.dl);b.dl.connect(b.wet);b.wet.connect(b.lp);
  A.bus=b;
  if(A.hbus)A.hbus.out.gain.setTargetAtTime(0,C.currentTime,.05);
};
A.spatial=function(vol,cut,pan,wet){
  if(!A.on||!A.bus)return;const t=A.ctx.currentTime,b=A.bus;
  b.vol.gain.setTargetAtTime(vol,t,.08);b.lp.frequency.setTargetAtTime(cut,t,.08);
  if(b.pan)b.pan.pan.setTargetAtTime(clamp(pan,-1,1),t,.08);b.wet.gain.setTargetAtTime(wet,t,.15);
};
A.horrorLevel=function(l){if(!A.on)return;A.hbus.out.gain.setTargetAtTime(clamp(l,0,1)*1.1,A.ctx.currentTime,l>0.5?.05:.35);};
A.at=function(gtTime){return Math.max(A.ctx.currentTime,A.ctx.currentTime+(gtTime-gt));};
A.noiseBurst=function(when,dur,freq,amp,dest,q){
  const C=A.ctx,s=C.createBufferSource();s.buffer=A.noise;
  const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
  const g=C.createGain();g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(amp,when+.006);g.gain.exponentialRampToValueAtTime(.0005,when+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(when,Math.random()*1.5);s.stop(when+dur+.02);
};
// one voiced sound: saw source → two formant bandpasses (shifted by fs) → envelope → dest
A.voiced=function(when,f0a,f0b,dur,vow,amp,att,dest,fs){
  const C=A.ctx;const o=C.createOscillator();o.type='sawtooth';fs=fs||A.formant;
  o.frequency.setValueAtTime(f0a,when);o.frequency.linearRampToValueAtTime(f0b,when+dur);
  // tiny wobble keeps it cute/alive
  const lfo=C.createOscillator();lfo.frequency.value=rnd(5,7);const lg=C.createGain();lg.gain.value=f0a*.018;lfo.connect(lg);lg.connect(o.frequency);
  const [F1,F2]=VOW[vow];
  const b1=C.createBiquadFilter();b1.type='bandpass';b1.frequency.value=F1*fs;b1.Q.value=4;
  const b2=C.createBiquadFilter();b2.type='bandpass';b2.frequency.value=F2*fs;b2.Q.value=7;
  const g2=C.createGain();g2.gain.value=.6;
  const g=C.createGain();g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(amp,when+att);
  g.gain.setValueAtTime(amp*.85,when+dur*.55);g.gain.linearRampToValueAtTime(0,when+dur);
  o.connect(b1);o.connect(b2);b1.connect(g);b2.connect(g2);g2.connect(g);g.connect(dest||A.bus.in);
  o.start(when);o.stop(when+dur+.03);lfo.start(when);lfo.stop(when+dur+.03);
};
A.syll=function(when,sp,dur){
  if(!A.on)return;const v=VOICES[sp];const f=v.f0*v.pitch*rnd(.9,1.15);const a=v.gain*A.voiceGain;
  A.voiced(when,f,f*rnd(.82,1.1),dur,(Math.random()*VOW.length)|0,a*.6,.022);
  if(Math.random()<.5)A.noiseBurst(when,.035,rnd(2600,6000),a*.16,A.bus.in,1.2);
};
// one "ha" of a laugh (aspirated h + voiced a)

// ================== maze ==================
function genMaze(n){
  const G=2*n+1,grid=new Uint8Array(G*G).fill(1);const id=(i,j)=>j*G+i;
  const seen=new Uint8Array(n*n);const stack=[[0,0]];seen[0]=1;grid[id(1,1)]=0;
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(stack.length){const [cx,cy]=stack[stack.length-1];
    const opts=D.filter(([dx,dy])=>{const x=cx+dx,y=cy+dy;return x>=0&&y>=0&&x<n&&y<n&&!seen[y*n+x];});
    if(!opts.length){stack.pop();continue;}
    const [dx,dy]=opts[(Math.random()*opts.length)|0];const x=cx+dx,y=cy+dy;
    seen[y*n+x]=1;grid[id(2*cx+1+dx,2*cy+1+dy)]=0;grid[id(2*x+1,2*y+1)]=0;stack.push([x,y]);}
  const deg=(cx,cy)=>D.reduce((s,[dx,dy])=>s+(grid[id(2*cx+1+dx,2*cy+1+dy)]===0?1:0),0);
  // braid a few dead ends (creates loops, keeps it fair)
  for(let cy=0;cy<n;cy++)for(let cx=0;cx<n;cx++){if((cx|cy)===0)continue;
    if(deg(cx,cy)===1&&Math.random()<.28){const o=D.filter(([dx,dy])=>{const x=cx+dx,y=cy+dy;return x>=0&&y>=0&&x<n&&y<n&&grid[id(2*cx+1+dx,2*cy+1+dy)]===1;});
      if(o.length){const [dx,dy]=o[(Math.random()*o.length)|0];grid[id(2*cx+1+dx,2*cy+1+dy)]=0;}}}
  // farthest border cell from start
  const cd=new Int16Array(n*n).fill(-1);cd[0]=0;const q=[[0,0]];
  while(q.length){const [cx,cy]=q.shift();for(const [dx,dy] of D){const x=cx+dx,y=cy+dy;
    if(x<0||y<0||x>=n||y>=n||cd[y*n+x]>=0)continue;if(grid[id(2*cx+1+dx,2*cy+1+dy)]!==0)continue;cd[y*n+x]=cd[cy*n+cx]+1;q.push([x,y]);}}
  let best=null,bd=-1;
  for(let k=0;k<n;k++)for(const [x,y] of[[n-1,k],[k,n-1]])if(cd[y*n+x]>bd){bd=cd[y*n+x];best=[x,y];}
  let ex,ey,edir;
  if(best[0]===n-1&&(best[1]!==n-1||Math.random()<.5)){ex=G-1;ey=2*best[1]+1;edir=[1,0];}else{ex=2*best[0]+1;ey=G-1;edir=[0,1];}
  grid[id(ex,ey)]=0;
  // props in remaining dead ends (obstacles; never on the route)
  const props=new Map();
  for(let cy=0;cy<n;cy++)for(let cx=0;cx<n;cx++){
    if((cx|cy)===0||(cx===best[0]&&cy===best[1]))continue;
    if(cx+cy<=1)continue;
    if(deg(cx,cy)===1&&Math.random()<.65){const t=id(2*cx+1,2*cy+1);grid[t]=2;props.set(t,(Math.random()*PROPS.length)|0);}}
  // distance field from exit (tiles)
  const dist=new Int16Array(G*G).fill(-1);dist[id(ex,ey)]=0;const tq=[[ex,ey]];
  while(tq.length){const [x,y]=tq.shift();for(const [dx,dy] of D){const a=x+dx,b=y+dy;
    if(a<0||b<0||a>=G||b>=G)continue;const t=id(a,b);if(grid[t]!==0||dist[t]>=0)continue;dist[t]=dist[id(x,y)]+1;tq.push([a,b]);}}
  return {n,G,grid,props,ex,ey,edir,dist,startD:dist[id(1,1)]};
}

  scene=name;st=0;hideBox();clearFloats();
  const gauge=$('gauge');gauge.classList.toggle('hidden',!(name==='play'||name==='ending'));
  $('ctrlHint').classList.add('hidden');$('skipHint').classList.toggle('hidden',!(name==='intro1'||name==='intro2'));

    pl={x:1*T+8,y:1*T+10,face:'down',frame:0,anim:0,stepT:0,bob:0,done:false};

function go(next,dur){if(trans)return;trans={t:0,dur:dur||.7,next,ph:'out'};}

}
function transLevel(){if(!trans)return 0;const k=clamp(trans.t/trans.dur,0,1);return trans.ph==='out'?k:1-k;}

function updIntro1(dt){

    if(!actors.said){actors.said=1;say('나 화장실 좀 다녀올게.','나');chat.hold=Math.max(chat.hold,gt+2);

    if(p.x<210){p.face='right';p.y=86;p.x+=34*dt;p.frame=((st*7)|0)%2?1:2;p.bob=p.frame===1?-1:0;}

function updIntro2(dt){

  const b=bath;A.spatial(1,700,.55,.15);

    addRipple(1,1.3,60);addRipple(.8,1.6,80);caption(big?'ㅋㅋㅋㅋㅋ':'ㅋㅋ',big);
    if(b.lines>0)b.drops.push({x:24,y:-18,v:6,age:0});}
  if(st>1&&ripNext<gt&&talker()>=0){ripNext=gt+rnd(.9,1.4);addRipple(.5,1.4,40);}
  if(st>16.4)go('play',.9);
}
function updPlay(dt){
  // input
  if(!pl.done){
    let vx=(keys.right?1:0)-(keys.left?1:0),vy=(keys.down?1:0)-(keys.up?1:0);
    const mv=vx||vy;
    if(mv){const l=Math.hypot(vx,vy);const sp=54*dt;vx=vx/l*sp;vy=vy/l*sp;
      const okx=vx?moveAxis(vx,0):false,oky=vy?moveAxis(0,vy):false;
      if(Math.abs(vx)>Math.abs(vy))pl.face=vx>0?'right':'left';else if(vy)pl.face=vy>0?'down':'up';else pl.face=vx>0?'right':'left';
      pl.anim+=dt;pl.frame=((pl.anim*7)|0)%2?1:2;pl.bob=((pl.anim*7)|0)%2?-1:0;
      pl.stepT-=dt;if(pl.stepT<=0&&(okx||oky)){pl.stepT=.28;A.step();}
    }else{pl.frame=0;pl.bob=0;pl.anim=0;}
    const ti=Math.floor(pl.x/T),tj=Math.floor(pl.y/T);
    if(ti===M.ex&&tj===M.ey){pl.done=true;go('ending',1);}
  }
  // sound direction through corridors
  const ti=Math.floor(pl.x/T),tj=Math.floor(pl.y/T);const G=M.G;
  let ci=ti,cj=tj;const d0=Math.max(0,M.dist[tj*G+ti]);
  for(let s=0;s<6;s++){const d=M.dist[cj*G+ci];if(d<=0)break;let moved=false;
    for(const [a,b] of[[1,0],[-1,0],[0,1],[0,-1]]){const t=(cj+b)*G+ci+a;if(M.dist[t]===d-1&&tileAt(ci+a,cj+b)===0){ci+=a;cj+=b;moved=true;break;}}
    if(!moved)break;}
  const tx=ci*T+8,ty=cj*T+8;let vx=tx-pl.x,vy=ty-pl.y;let l=Math.hypot(vx,vy)||1;vx/=l;vy/=l;
  const exx=(M.ex+M.edir[0]*.5)*T+8,exy=(M.ey+M.edir[1]*.5)*T+8;let wx=exx-pl.x,wy=exy-pl.y;const wl=Math.hypot(wx,wy)||1;
  let dx=vx*.65+wx/wl*.35,dy=vy*.65+wy/wl*.35;l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  sound.dx+=(dx-sound.dx)*Math.min(1,dt*5);sound.dy+=(dy-sound.dy)*Math.min(1,dt*5);
  l=Math.hypot(sound.dx,sound.dy)||1;sound.dx/=l;sound.dy/=l;
  sound.close=clamp(1-d0/Math.max(1,M.startD),0,1);
  sound.srcD=clamp(wl,26,84);
  updVis(dt);
  // horror state machine
  const h=horror;
  if(h.phase==='none'){
    if(fomo.v>fomo.floor)fomo.v=Math.max(fomo.floor,fomo.v-dt*1.2);
    if(gt>=h.next&&!pl.done)startBig();
    else if(gt>=smallNext&&gt<h.next-2.5){smallNext=gt+rnd(4,9);laughEvent('small');fomoAdd(1.5);
      wob.amt=Math.max(wob.amt,1.1);addRipple(1,1.2,56);addRipple(.8,1.5,70);const nb=2+((Math.random()*2)|0);for(let q=0;q<nb;q++)spawnFloat('n',true);}
  }else if(h.phase==='peak'){
    h.t=1;fomoAdd(dt*(2.4+fomo.v*.02));
    h.spawnT-=dt;if(h.spawnT<=0){h.spawnT=rnd(.18,.4);spawnEyes(1);}
    updEyes(dt);
    if(gt>=h.end){h.phase='rec';h.recS=gt;fomo.floor=fomo.v*.78;}
  }else if(h.phase==='rec'){
    const k=(gt-h.recS)/2.4;h.t=Math.pow(Math.max(0,1-k),1.4);
    for(const e of h.eyes)e.a=clamp(1-k*1.5-e.fo,0,1);
    updEyes(dt);
    if(k>=1){h.phase='none';h.t=0;h.eyes=[];h.next=gt+rnd(8,17);smallNext=gt+rnd(3,6);}
  }
  A.drone(h.t);A.horrorLevel(h.phase==='peak'?1:h.t);
  if(h.phase==='peak'){const dur=Math.max(3,h.dur||3),prog=clamp(1-(h.end-gt)/dur,0,1);
    h.layerT=(h.layerT||0)-dt;
    if(h.layerT<=0){const n=prog>.5&&Math.random()<.5?2:1;for(let q=0;q<n;q++)A.laughLayer(prog);
      h.layerT=(.55-.37*prog)*rnd(.6,1.3);
      const sp=(Math.random()*3)|0;laughUntil[sp]=Math.max(laughUntil[sp],gt+.8);}}
  // floating chatter: rate follows voices (direction/closeness) and laughter loudness
  let laughN=0;for(let q=0;q<3;q++)if(gt<laughUntil[q])laughN++;
  if(h.phase==='peak'){const prog=clamp((gt-(h.end-Math.max(3,h.dur||3)))/Math.max(3,h.dur||3),0,1);
    const rate=5+laughN*6*(1-prog*.35);if(Math.random()<rate*dt)spawnFloat('h');if(Math.random()<rate*dt*.5)spawnFloat('h');}
  else{let rate=(talker()>=0?.5+sound.close*1.2:.12)+laughN*1.6;
    if(h.phase==='rec')rate+=7*h.t;
    if(Math.random()<rate*dt)spawnFloat(h.phase==='rec'&&h.t>.4?'h':'n');}
  // chatter ripples
  if(gt>ripNext&&talker()>=0){ripNext=gt+(1.25-sound.close*.75)*rnd(.8,1.2);addRipple(.45+sound.close*.55,1.3,30+sound.close*30);}
  A.spatial(.38+.92*Math.pow(sound.close,1.3),500+7000*sound.close*sound.close,sound.dx*.85,.04+h.t*.45);
}
function fomoAdd(v){const before=fomo.v;fomo.v=Math.min(100,fomo.v+v);if(fomo.v-before>.9){const g=$('gauge');g.classList.remove('bump');void g.offsetWidth;g.classList.add('bump');fomo.flashT=.25;}}
function startBig(){
  const h=horror;const dur=laughEvent('big');
  h.phase='peak';h.t=1;h.end=gt+Math.max(3,dur);h.eyes=[];h.spawnT=0;
  setPalette(1);fomoAdd(7);spawnEyes(9);A.boom();
  wob.amt=Math.max(wob.amt,2.4);addRipple(1,1,70);addRipple(1,1.4,90);addRipple(1,1.8,110);
  h.dur=dur;for(let q=0;q<9;q++)spawnFloat('h',q<5);
  beat.ph=.95;
}
function spawnEyes(n){
  const h=horror;if(h.eyes.length>=18)return;
  const pi=Math.floor(pl.x/T),pj=Math.floor(pl.y/T);const cand=[];
  for(let j=pj-5;j<=pj+5;j++)for(let i=pi-6;i<=pi+6;i++){if(i<0||j<0||i>=M.G||j>=M.G)continue;
    if(isWall(i,j)&&Math.hypot(i*T+8-pl.x,j*T+8-pl.y)<84)cand.push([i,j]);}
  let tries=0;
  while(n>0&&cand.length&&tries++<90){
    const [i,j]=cand[(Math.random()*cand.length)|0];const big=Math.random()<.35;const sh=EYES[big?'b':'s'];const pw=pairW(sh);
    const x=i*T+((Math.random()*T)|0)-((Math.random()*pw)|0),y=j*T+1+((Math.random()*(T-sh.h-2))|0);
    // the whole pair must sit on wall tiles that the player can see
    const ta=Math.floor(x/T),tb=Math.floor((x+pw-1)/T),r0=Math.floor(y/T),r1=Math.floor((y+sh.h)/T);let ok=true;
    for(let a=ta;a<=tb&&ok;a++)for(let b=r0;b<=r1;b++)if(a<0||b<0||a>=M.G||b>=M.G||!isWall(a,b)){ok=false;break;}
    if(!ok)continue;
    if(h.eyes.some(e=>{const w2=pairW(EYES[e.big?'b':'s']);return x<e.x+w2+4&&e.x<x+pw+4&&y<e.y+9&&e.y<y+sh.h+4;}))continue;
    h.eyes.push({x,y,big,ti:r0*M.G+ta,ti2:r1*M.G+tb,born:gt+rnd(.3),a:1,fo:rnd(.3),fr:0,ft:rnd(.1,.3)});n--;
  }
}
function updEnding(dt){
  A.spatial(1,9000,0,0);animFriends(dt);const p=actors[3];const b=actors[1];
  if(st<2.2){p.face='left';p.x=Math.max(131,204-st*36);p.frame=((st*7)|0)%2?1:2;p.bob=p.frame===1?-1:0;}
  else if(!p.seated){p.seated=true;p.x=131;p.y=89;p.frame=0;p.bob=0;}
  if(st>.8&&st<3.4){b.face='right';b.lock=true;b.talk=false;}else b.lock=false;
  if(st>1.1&&!actors.said){actors.said=1;say('아, 왔어?','친구');chat.hold=gt+2.2;}
  if(st>3.6&&actors.said===1){actors.said=2;hideBox();}
  if(st>4.6&&!actors.laughed){actors.laughed=1;laughEvent('group');laughUntil[3]=gt+1.2;}
  if(p.seated){p.eyes=gt<laughUntil[3]?'laugh':'dot';p.face=talker()===0||talker()===2?'left':'left';}
  if(st>7.2&&!endShown){endShown=true;showEnd();}
}
function showEnd(){
  const v=Math.round(fomo.v);$('endNum').innerHTML=v+'<small>/100</small>';$('endFill').style.width='0';
  $('endOv').classList.remove('hidden');$('gauge').classList.add('hidden');
  requestAnimationFrame(()=>{$('endFill').style.transition='width 1.2s steps(12)';$('endFill').style.width=`calc(${v}% - ${v/100*2*S}px)`;});
  $('eRestart').focus();
}

// ================== frame ==================
function update(dt){
  if(scene!=='endonly'){planChat();}
  if(scene==='intro1')updIntro1(dt);else if(scene==='intro2')updIntro2(dt);else if(scene==='play')updPlay(dt);else if(scene==='ending')updEnding(dt);
  updTrans(dt);updBox(dt);updFloats(dt);
  wob.amt*=Math.exp(-dt*1.8);
  // heartbeat
  if(scene==='play'&&horror.t>.02){const bpm=84+fomo.v*.5+horror.t*18;const prev=beat.ph;beat.ph+=dt*bpm/60;
    if(Math.floor(beat.ph)>Math.floor(prev)){beat.pulse=1;A.heart(.55*horror.t+.1);}}
  beat.pulse*=Math.exp(-dt*5);
  // gauge
  fomo.shown+=(fomo.v-fomo.shown)*Math.min(1,dt*12);
  if(fomo.ghost<fomo.shown)fomo.ghost=fomo.shown;else fomo.ghost+=(fomo.shown-fomo.ghost)*Math.min(1,dt*1.6);
  fomo.flashT-=dt;
}
const gaugeEl=$('gauge'),gFill=gaugeEl.querySelector('.fill'),gGhost=gaugeEl.querySelector('.ghost');
function render(){
  if(scene==='play')setPalette(horror.t);else setPalette(0);
  if(scene==='intro1'||scene==='ending')drawCafe(actors);
  else if(scene==='intro2'){drawBath();drawRipples();}
  else if(scene==='play')renderPlay();
  const tl=transLevel();if(tl>0)ditherRect(0,0,W,H,tl*17,FOG);
  // gauge DOM
  const inner=S*44-2*S;gFill.style.width=Math.round(fomo.shown/100*inner/S)*S+'px';gGhost.style.width=Math.round(fomo.ghost/100*inner/S)*S+'px';
  gaugeEl.classList.toggle('flash',fomo.flashT>0);gaugeEl.classList.toggle('high',fomo.v>70);
  // blit with distortion
  sx.imageSmoothingEnabled=false;
  const hz=scene==='play'?horror.t:0;
  const amp=wob.amt+hz*(.8+beat.pulse*1.6);
  if(amp<.25){sx.drawImage(lo,0,0,W*S,H*S);}
  else{
    sx.fillStyle=P[FOG];sx.fillRect(0,0,W*S,H*S);
    const colMode=Math.abs(sound.dx)>=Math.abs(sound.dy);const sgn=colMode?Math.sign(sound.dx)||1:Math.sign(sound.dy)||1;
    if(colMode){for(let x=0;x<W;x++){const side=clamp(sgn*(x-W/2)/(W/2),0,1);const wgt=hz*.6+.35+.65*side;
        const o=Math.round(Math.sin(x*.16+gt*7)*amp*wgt);sx.drawImage(lo,x,0,1,H,x*S,o*S,S,H*S);}}
    else{for(let y=0;y<H;y++){const side=clamp(sgn*(y-H/2)/(H/2),0,1);const wgt=hz*.6+.35+.65*side;
        const o=Math.round(Math.sin(y*.18+gt*7)*amp*wgt);sx.drawImage(lo,0,y,W,1,o*S,y*S,W*S,S);}}
  }
  const sc=1+beat.pulse*.016*hz;stage.style.transform=sc>1.0005?`scale(${sc.toFixed(4)})`:'';
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){gt+=dt;st+=dt;update(dt);}
  render();requestAnimationFrame(frame);
}

// ================== controls ==================
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function enableAudio(){
  const first=!A.ctx;A.init();if(A.on)$('soundHint').classList.add('hidden');
  return first;
}
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];
  if(k){keys[k]=true;e.preventDefault();}
  const first=enableAudio();
  if(e.code==='KeyP'||e.code==='Escape'){if(scene!=='ending'||!endShown)togglePause();e.preventDefault();}
  if((e.code==='Enter'||e.code==='Space')&&!first&&!paused&&(scene==='intro1'||scene==='intro2')){go(scene==='intro1'?'intro2':'play',.4);e.preventDefault();}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=false;});
addEventListener('pointerdown',()=>enableAudio());
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&!endShown)togglePause();});
function togglePause(){
  paused=!paused;$('pauseOv').classList.toggle('hidden',!paused);
  for(const k in keys)keys[k]=false;
  if(A.ctx){if(paused)A.ctx.suspend().catch(()=>{});else A.ctx.resume().catch(()=>{});}
  if(paused)$('pResume').focus();
}
function restart(){
  paused=false;$('pauseOv').classList.add('hidden');$('endOv').classList.add('hidden');
  document.querySelectorAll('.kk').forEach(e=>e.remove());clearFloats();
  if(A.ctx){A.ctx.resume().catch(()=>{});A.makeBus();A.drone(0);A.horrorLevel(0);}
  resetState();setPalette(0);setScene('intro1');
  if(!A.on)$('soundHint').classList.remove('hidden');
  document.activeElement&&document.activeElement.blur();
}
$('bPause').onclick=e=>{enableAudio();if(!endShown)togglePause();e.currentTarget.blur();};
$('bRestart').onclick=()=>{enableAudio();restart();};
$('pResume').onclick=()=>togglePause();
$('pRestart').onclick=()=>restart();
$('eRestart').onclick=()=>restart();
$('pMute').onclick=()=>{enableAudio();A.setMute(!A.muted);$('pMute').textContent=A.muted?'소리 켜기':'소리 끄기';};

// debug hooks for testing
window.__fomo={get s(){return {scene,st,gt,horror,fomo,pl,M,paused};},go:s=>setScene(s),big:()=>startBig(),setGt:v=>{gt=v;}};

resetState();setScene('intro1');requestAnimationFrame(frame);
}
</script>
